services:
  postgres:
    image: postgres:15-alpine
    container_name: vectracom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vectracom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vectracom_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vectracom}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectracom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vectracom-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: vectracom-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vectracom}:${POSTGRES_PASSWORD:-vectracom_dev}@postgres:5432/${POSTGRES_DB:-vectracom}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  # Matrix Dendrite (optionnel) — docker compose --profile matrix up -d
  # Backend .env : MATRIX_HOMESERVER=http://localhost:8008
  # Sans ça, le chat Nest (Postgres) fonctionne déjà.
  dendrite:
    profiles: ["matrix"]
    image: matrixdotorg/dendrite-monolith:latest
    container_name: vectracom-dendrite
    volumes:
      - ./infra/dendrite:/etc/dendrite
      - dendritedata:/var/dendrite
    ports:
      - "${DENDRITE_PORT:-8008}:8008"
    entrypoint: ["/usr/bin/dendrite"]
    command: ["--config=/etc/dendrite/dendrite.yaml"]
    restart: unless-stopped

  # WhatsApp Remontée bridge (optionnel) — docker compose --profile remontee up -d
  # Prérequis : profil matrix (Dendrite) + login QR mautrix (voir infra/mautrix-whatsapp/README.md).
  # Le bridge Matrix ↔ WhatsApp ; le forward vers Nest se fait via POST /api/v1/remontee/ingest
  # (secret REMONTEE_BRIDGE_SECRET). Sans mautrix, utiliser POST /remontee/simulate (admin JWT).
  mautrix-whatsapp:
    profiles: ["remontee"]
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: vectracom-mautrix-whatsapp
    depends_on:
      - postgres
    volumes:
      - ./infra/mautrix-whatsapp:/data
    environment:
      # Config lue depuis /data/config.yaml (générée au premier run, voir README)
      TZ: Africa/Dakar
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  dendritedata:
